<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="HSN CEMENT AND STEEL — Premium Building Materials" />
    <!-- BUILD 72: Open Graph tags for a proper WhatsApp / link preview.
         Before this, the page had og:title + og:description (both just
         the site name) and NO og:image, og:url or twitter image — so a
         shared link showed up as a plain blue URL with no preview card.
         og:image must be an absolute URL for WhatsApp's crawler, so it
         points at the live site's own 512x512 logo icon, not a relative
         path. Title stays the site name only (BUILD 60 rule); the
         description reuses the site's own Navbar tagline. -->
    <meta property="og:title" content="HSN CEMENT AND STEEL" />
    <meta property="og:description" content="HSN CEMENT AND STEEL — Premium Building Materials" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hsncementandsteel-sigma.vercel.app/" />
    <meta property="og:site_name" content="HSN CEMENT AND STEEL" />
    <meta property="og:image" content="https://hsncementandsteel-sigma.vercel.app/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="HSN CEMENT AND STEEL logo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="HSN CEMENT AND STEEL" />
    <meta name="twitter:description" content="HSN CEMENT AND STEEL — Premium Building Materials" />
    <meta name="twitter:image" content="https://hsncementandsteel-sigma.vercel.app/icons/icon-512.png" />
    <title>HSN CEMENT AND STEEL</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0C0E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HSN" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Poppins:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-obsidian text-ivory antialiased selection:bg-brand-500 selection:text-slate-950">

  </body>
</html>
